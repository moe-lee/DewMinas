<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../static/css/globals.css" />
    <link rel="stylesheet" href="../static/css/styleguide.css" />
    <link rel="stylesheet" href="../static/css/project_preview.css" />
</head>
    <body>
        <div class="main-bar">
            <img class="logo" src="../static/../static/img/logo.png"></img>
            <div class="link-page">
            <a class="link-text" href="javascript:history.back()">수정</a>
            <div class="vertical-divider"></div>
            <div class="link-text" onclick="location.href='/logout'">로그아웃</div>
        </div>
        </div>
        
        <div class="project-preview">
            <div class="heading">
                <div class="head-text"></div>
            </div>
            <div class="open-sources">
                <img class="img" src="../static/img/level_2.png" />
                <div class="div">
                    <div class="summary-frame">
                        <div class="overlap-group">
                            <div class="div-wrapper">
                                <div class="text-wrapper-2">/Summary/</div>
                            </div>
                            <div class="text-wrapper" name="summary"></div>
                        </div>
                    </div>
                    <div class="skill-frame">
                        <div class="div-wrapper-2">
                            <label class="text-wrapper-3">/Skills/</label>                    
                        </div>
                        <div class="input-icon" name="skill-icon" >
                            <img class="skill-icon" src="../static/img/java.png"style="display: none;"></img>
                        </div>
                    </div>
                    <div class="source-frame">
                        <div class="sources-linraries">
                            <label class="text-wrapper-3">/Open sources/</label>
                        </div>
                        <div class="input-1" name="projectSources"> </div>
                        <div class="sources-linraries">
                            <label class="text-wrapper-3">/repositoryLinks/</label>
                        </div>
                        <div class="input-1" name="repositoryLinks"> </div>
                    </div>
                </div>
            </div>
            <div class="role-frame">
                <div class="div-wrapper-3">
                    <div class="text-wrapper-4">/Role /</div>
                </div>
                <div class="role-title" name="role-title"></div>
                <div class="role-comment" name="role-comment"></div>
            </div>
            <div class="trouble-shooting">
                <div class="div-wrapper-3">
                    <div class="trouble-shooting-2">/Trouble shooting/</div>
                </div>
                <div class="trouble" style="display: none;">
                    <div class="text-wrapper-5" name="trouble-problem">Problem</div>
                    <div class="text-wrapper-5" name="trouble-solution">Solution</div>
                    <div class="text-wrapper-5" name="trouble-result">Result</div>
                    <div class="text-wrapper-5" name="trouble-lesson">Lesson</div>
                </div>
            </div>
        </div>
    </body>
    <script src="../static/js/project_preview.js"></script>
</html>
